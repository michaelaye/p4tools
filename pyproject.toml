[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "p4tools"
dynamic = ["version"]
description = "Tools for working with data from the Planet Four Zooniverse project."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael Aye", email = "kmichael.aye@gmail.com"}]
keywords = ['zooniverse', 'citizen_science', 'panoptes']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['pandas', 'pooch', 'numpy', 'matplotlib', 'shapely', 'tqdm', 'pyarrow', 'typer', 'rich', 'geopandas', 'scikit-learn', 'scipy', 'seaborn']

[project.optional-dependencies]
dev = ["nbdev>=3"]
pipeline = ["planetarypy", "kalasiris", "rasterio", "rioxarray"]

[project.urls]
Repository = "https://github.com/michaelaye/p4tools"
Documentation = "https://michaelaye.github.io/p4tools/"

[project.entry-points.nbdev]
p4tools = "p4tools._modidx:d"


[project.scripts]
p4 = "p4tools.clis:app"

[tool.setuptools.dynamic]
version = {attr = "p4tools.__version__"}

[tool.setuptools.packages.find]
include = ["p4tools*"]

[tool.nbdev]
nbs_path = 'notebooks'
jupyter_hooks = true
custom_sidebar = false

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "tests", "conda.recipe", "benchmarks", ".asv"]

[tool.ruff.lint]
# Carried over from the old flake8 config. Under ruff's default rule set
# (E4/E7/E9/F) only these two were actually being silenced; the former
# E122/E123/E126/E128 ignores were flake8-only continuation-line checks that
# ruff does not run by default, so they're dropped.
ignore = ["E731", "E722"]

[tool.pytest.ini_options]
norecursedirs = [".*", "*.egg*", "build", "dist", "conda.recipe"]
addopts = [
    "--junitxml=junit.xml",
    "--cov-report=term-missing",
    "--tb=native",
    "--strict-markers",
    "--durations=20",
]
markers = ["serial: execute test serially (to avoid race conditions)"]
